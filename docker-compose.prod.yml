# ──────────────────────────────────────────────────────────────────────────────
# docker-compose.prod.yml — PRODUCTION OVERRIDES
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Overrides the backend to run the compiled `prod` image (node dist/index.js):
#   - no source bind-mounts
#   - NODE_ENV=production
#   - migrations still run first via the one-shot `migrate` service
# ──────────────────────────────────────────────────────────────────────────────
services:
  backend:
    build:
      context: .
      target: prod
    image: jolie-backend:prod
    command: ['node', 'dist/index.js']
    volumes: !reset []
    environment:
      NODE_ENV: production
      LOG_PRETTY: 'false'
    restart: always
